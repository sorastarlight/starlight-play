<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>My Pokédex · THE STARLIGHT PLAY HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/play.css?v=card7">
<body data-page="pokedex">
<nav class="topnav">
  <div class="topnav-inner">
    <a class="topnav-brand" href="./">
      <img src="images/sora-starlight-logo.png" alt="Sora Starlight">
    </a>
    <div class="topnav-end">
      <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="topnav-panel">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
        <span class="visually-hidden">Open menu</span>
      </button>
      <div id="topnav-panel" class="topnav-panel">
        <div id="topnav-links" class="topnav-links"></div>
      </div>
      <div class="topnav-actions">
      <p id="auth-status" class="visually-hidden" role="status">Checking Twitch sign-in…</p>
      <button id="sign-in" class="signin-btn" type="button" hidden title="Sign in with Twitch">Sign in</button>
      <div id="account" class="account" hidden>
        <button id="account-button" class="account-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu">
          <img id="account-avatar" class="avatar" alt="" hidden>
          <span id="account-fallback" class="avatar-fallback" hidden></span>
          <span class="account-meta">
            <span id="account-name" class="account-name">Trainer</span>
            <span id="account-level" class="account-level" hidden></span>
          </span>
          <span class="account-caret" aria-hidden="true"></span>
        </button>
        <div id="account-menu" class="account-menu" hidden role="menu">
          <p id="account-handle" class="account-handle"></p>
          <div id="account-trainer" class="account-trainer" hidden></div>
          <a id="account-card" href="./trainer.html" role="menuitem">My Trainer ID</a>
          <a id="account-settings" href="./settings.html" role="menuitem">Settings</a>
          <a id="account-staff" href="./admin.html" hidden role="menuitem">Staff hub</a>
          <button id="sign-out" type="button" role="menuitem">Sign out</button>
        </div>
      </div>
    </div>
    </div>
  </div>
</nav>
<div class="wrap">
  <div class="page-kicker">
    <h1>My Pokédex</h1>
  </div>
  <p id="gate" class="notice">Sign in with Twitch to open your Pokédex.</p>
  <div id="dex-app" hidden>
    <section class="card body team-floor">
      <div class="team-head">
        <div>
          <h2>My Team</h2>
          <p class="muted">Choose up to six Pokémon you’ve caught. Your team also appears on your Trainer ID.</p>
        </div>
        <a class="button secondary" href="./settings.html">Edit in Settings</a>
      </div>
      <div id="team-slots" class="team-slots"></div>
      <p id="team-status" class="muted" role="status"></p>
    </section>
    <section class="card body dex-toolbar">
      <p id="dex-summary" class="muted"></p>
      <div class="dex-filters">
        <label>Region
          <select id="filter-region">
            <option value="kanto">Kanto</option>
          </select>
        </label>
        <label>Gen
          <select id="filter-gen">
            <option value="1">Gen 1</option>
          </select>
        </label>
        <label>Form
          <select id="filter-form">
            <option value="all">All</option>
            <option value="normal">Normal</option>
            <option value="female">Female</option>
            <option value="shiny">Shiny</option>
          </select>
        </label>
        <label>Gender
          <select id="filter-gender">
            <option value="all">All</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Genderless">Genderless</option>
          </select>
        </label>
        <label>Status
          <select id="filter-status">
            <option value="all">All</option>
            <option value="caught">Caught</option>
            <option value="seen">Seen</option>
            <option value="unknown">Unknown</option>
          </select>
        </label>
      </div>
    </section>
    <div id="dex-grid" class="pokedex-grid"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/species.js"></script>
<script src="js/game.js"></script>
<script src="js/trainers.js?v=card7"></script>
<script src="js/team.js?v=card7"></script>
<script src="js/nav.js?v=nav1"></script>
<script src="js/pokedex.js?v=id3"></script>
</body>
