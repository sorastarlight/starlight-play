<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Starlight Mart · THE STARLIGHT PLAY HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/play.css?v=store15">
<body data-page="store">
<nav class="topnav">
  <div class="topnav-inner">
    <a class="topnav-brand" href="./">
      <img src="images/sora-starlight-logo.png" alt="Sora Starlight">
    </a>
    <div class="topnav-end">
      <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="topnav-panel">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
        <span class="visually-hidden">Open menu</span>
      </button>
      <div id="topnav-panel" class="topnav-panel">
        <div id="topnav-links" class="topnav-links"></div>
      </div>
      <div class="topnav-actions">
      <p id="auth-status" class="visually-hidden" role="status">Checking Twitch sign-in…</p>
      <button id="sign-in" class="signin-btn" type="button" hidden title="Sign in with Twitch">Sign in</button>
      <div id="account" class="account" hidden>
        <button id="account-button" class="account-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu">
          <img id="account-avatar" class="avatar" alt="" hidden>
          <span id="account-fallback" class="avatar-fallback" hidden></span>
          <span class="account-meta">
            <span id="account-name" class="account-name">Trainer</span>
            <span id="account-level" class="account-level" hidden></span>
          </span>
          <span class="account-caret" aria-hidden="true"></span>
        </button>
        <div id="account-menu" class="account-menu" hidden role="menu">
          <p id="account-handle" class="account-handle"></p>
          <div id="account-trainer" class="account-trainer" hidden></div>
          <a id="account-card" href="./trainer.html" role="menuitem">My Trainer ID</a>
          <a id="account-settings" href="./settings.html" role="menuitem">Settings</a>
          <a id="account-staff" href="./admin.html" hidden role="menuitem">Admin Hub</a>
          <button id="sign-out" type="button" role="menuitem">Sign out</button>
        </div>
      </div>
    </div>
    </div>
  </div>
</nav>
<div class="wrap mart-wrap">
  <div class="page-kicker">
    <h1>Welcome! May I help you?</h1>
  </div>
  <p id="mart-status" class="muted" role="status"></p>
  <section id="mart-wallet" class="mart-wallet" aria-label="Your trainer funds">
    <div class="mart-wallet-grid">
      <article class="mart-wallet-card">
        <img src="images/items/relic-gold.png" alt="">
        <div>
          <p class="eyebrow">PokéCoins</p>
          <p id="coin-wallet" class="mart-wallet-value poke-cash"><span class="poke-cash-mark" aria-hidden="true">₽</span><span>—</span></p>
        </div>
      </article>
      <article class="mart-wallet-card">
        <img src="images/items/explorer-kit.png" alt="">
        <div>
          <p class="eyebrow">Bag space</p>
          <p id="capacity-note" class="mart-wallet-value">—</p>
          <div class="bag-space" aria-hidden="true"><i id="capacity-bar"></i></div>
          <p id="mart-wallet-slots" class="mart-wallet-slots">Sign in to see bag space.</p>
        </div>
      </article>
    </div>
    <p id="bag-full-warn" class="bag-full-warn" hidden role="status"></p>
  </section>
  <div id="mart-floors"></div>
</div>
<dialog id="ball-modal" class="play-modal play-modal-balls" aria-labelledby="ball-title">
  <form class="play-modal-card" method="dialog">
    <header class="play-modal-head">
      <h3 id="ball-title">Other Poké Balls</h3>
      <button class="secondary" value="cancel" type="submit">Close</button>
    </header>
    <p class="muted">Catch rates are the Play throw chances. These extra balls look different; they do not change the catch math.</p>
    <div id="ball-grid" class="ball-grid"></div>
  </form>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/game.js?v=store9"></script>
<script src="js/trainers.js?v=gb2"></script>
<script src="js/hud.js?v=store8"></script>
<script src="js/nav.js?v=gts3"></script>
<script src="js/store.js?v=store13"></script>
</body>
