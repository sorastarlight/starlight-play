<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated device acceptance</title><style>body{font:16px system-ui;margin:20px;background:#f9f4ff;color:#38374e}button,select{font:inherit;padding:8px;margin:6px}iframe{display:block;height:800px;border:2px solid #a99bc1;background:white;margin-top:15px}</style><h1>Isolated device acceptance</h1><p>CSS viewport widths only, not a physical-device or browser-zoom certification. Preview pages have no account or backend connection.</p><label>Viewport width <select id="width"><option>320</option><option>390</option><option>768</option><option>1280</option></select></label><label>Preview <select id="page"><option value="milestone-review.html">Celebrations</option><option value="nav-focus-review.html">Navigation</option><option value="registration-feedback-review.html">Signup feedback</option><option value="support-loading-review.html">Helpdesk</option><option value="signin-pending-review.html">Sign-in feedback</option><option value="dialog-acceptance-review.html">Dialogs</option><option value="remaining-dialog-review.html?context=codex90">Remaining dialogs</option></select></label><button id="level">Show level</button><button id="achievement">Show achievement</button><button id="dismiss">Dismiss preview</button><label>Dialog sample <select id="dialog-sample"><option value="0">Helpdesk new ticket</option><option value="1">Helpdesk status</option><option value="2">Team backgrounds</option><option value="3">PC confirmation</option><option value="4">PC move</option><option value="5">Studio item</option><option value="6">Studio crop</option><option value="7">Content picker</option><option value="8">Team picker</option><option value="9">Settings unsaved warning</option><option value="10">Settings Twitch warning</option><option value="11">Sign-in Twitch warning</option></select></label><button id="open-dialog">Open dialog preview</button><span id="dialog-status" role="status"></span><button id="measure">Measure layout</button><output id="metrics"></output><iframe id="preview" title="Isolated preview" src="milestone-review.html" style="width:320px"></iframe><script>const frame=document.getElementById('preview');document.getElementById('open-dialog').onclick=async()=>{const status=document.getElementById('dialog-status');status.textContent='Loading dialog preview';const d=frame.contentDocument,pick=d.getElementById('sample'),open=d.getElementById('open');if(!pick||!open){status.textContent='Select Remaining dialogs first';return;}pick.value=document.getElementById('dialog-sample').value;await open.onclick();status.textContent=d.querySelector('dialog[open]')?'Dialog preview ready':'Dialog preview failed';};document.getElementById('width').onchange=e=>frame.style.width=e.target.value+'px';document.getElementById('page').onchange=e=>frame.src=e.target.value;for(const name of ['level','achievement'])document.getElementById(name).onclick=()=>frame.contentDocument.getElementById(name)?.click();document.getElementById('dismiss').onclick=()=>frame.contentDocument.querySelector('[data-present-continue]')?.click();document.getElementById('measure').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow,p=d.querySelector('dialog[open],[data-present-panel]'),b=Array.from(d.querySelectorAll('button')).find(e=>e.textContent==='Continue');document.getElementById('metrics').textContent=JSON.stringify({page:d.title,viewport:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,overflowControls:Array.from(d.querySelectorAll('input,button,select,textarea')).filter(e=>e.getClientRects().length).map(e=>e.getBoundingClientRect()).filter(r=>r.left<0||r.right>w.innerWidth).map(r=>({left:r.left,right:r.right})),panel:p?{left:p.getBoundingClientRect().left,right:p.getBoundingClientRect().right}:null,button:b?{left:b.getBoundingClientRect().left,right:b.getBoundingClientRect().right}:null});};</script></html>
