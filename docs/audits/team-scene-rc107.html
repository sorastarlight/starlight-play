<h1>My Team environment-first scene previews (rc107)</h1>

<script src="../../js/variants.js"></script>

  { id: "b", dex: 150, name: "Mewtwo", displayName: "Mewtwo", variant: "normal" },
  { id: "c", dex: 136, name: "Flareon", displayName: "Flareon", variant: "normal" },

  { id: "e", dex: 29, name: "Nidoran♀", displayName: "Nidoran♀", variant: "normal", gender: "female" },
  { id: "f", dex: 135, name: "Jolteon", displayName: "Jolteon", variant: "shiny", shiny: true }
];
const ids = ["viridian-forest","gen1-mono","gen2-color","gen3-gba","gen4-ds","retro-battle","kanto-route","owner-town011","owner-road001","mt-moon"];
const grid = document.getElementById("grid");

  const wrap = document.createElement("section");

});
