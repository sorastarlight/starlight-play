<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated device acceptance</title><style>body{font:16px system-ui;margin:20px;background:#f9f4ff;color:#38374e}button,select{font:inherit;padding:8px;margin:6px}iframe{display:block;height:800px;border:2px solid #a99bc1;background:white;margin-top:15px}</style><h1>Isolated device acceptance</h1><p>CSS viewport widths only, not a physical-device or browser-zoom certification. Preview pages have no account or backend connection.</p><label>Viewport width <select id="width"><option>320</option><option>390</option><option>768</option><option>1280</option></select></label><label>Preview <select id="page"><option value="milestone-review.html">Celebrations</option><option value="nav-focus-review.html">Navigation</option><option value="registration-feedback-review.html">Signup feedback</option></select></label><button id="level">Show level</button><button id="achievement">Show achievement</button><button id="dismiss">Dismiss preview</button><button id="measure">Measure layout</button><output id="metrics"></output><iframe id="preview" title="Isolated preview" src="milestone-review.html" style="width:320px"></iframe><script>const frame=document.getElementById('preview');document.getElementById('width').onchange=e=>frame.style.width=e.target.value+'px';document.getElementById('page').onchange=e=>frame.src=e.target.value;for(const name of ['level','achievement'])document.getElementById(name).onclick=()=>frame.contentDocument.getElementById(name)?.click();document.getElementById('dismiss').onclick=()=>frame.contentDocument.querySelector('[data-present-continue]')?.click();document.getElementById('measure').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow,p=d.querySelector('[data-present-panel]'),b=Array.from(d.querySelectorAll('button')).find(e=>e.textContent==='Continue');document.getElementById('metrics').textContent=JSON.stringify({viewport:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,panel:p?{left:p.getBoundingClientRect().left,right:p.getBoundingClientRect().right}:null,button:b?{left:b.getBoundingClientRect().left,right:b.getBoundingClientRect().right}:null});};</script></html>
