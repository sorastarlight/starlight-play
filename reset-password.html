<!doctype html>
<html lang="en" data-recovery-page="true">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<script src="js/config.js?v=20261008-rc133"></script>
<script src="js/recovery-flow.js?v=20261008-rc133"></script>
<title>Reset password · Sora Starlight</title>
<link rel="stylesheet" href="css/play.css?v=20261008-rc133">
<link rel="stylesheet" href="css/password-recovery.css?v=20261008-rc133">
<body>
<main class="recovery-shell">
  <section class="card body recovery-card">
    <p class="eyebrow">Trainer Account</p><h1>Choose a new password</h1>
    <p id="recovery-status" role="status" aria-live="polite">Checking your recovery link…</p>
    <form id="recovery-form" hidden>
      <label class="field" for="new-password">New password<input id="new-password" type="password" autocomplete="new-password" minlength="8" required disabled></label>
      <label class="field" for="confirm-password">Confirm new password<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required disabled></label>
      <button type="submit" disabled>Update password</button>
    </form>
    <p id="recovery-finish" hidden><a class="btn" href="./signin.html">Sign in</a></p>
    <p><a href="./signin.html?reset=1">Request a new reset link</a></p>
    <p class="muted">Open the link in the browser where you requested it. Never share your recovery link or password with staff.</p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/build.js?v=20261008-rc133"></script>
<script src="js/build-client.js?v=20261008-rc133"></script>
<script src="js/reset-password.js?v=20261008-rc133"></script>
</body>
</html>
