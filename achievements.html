<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Achievements · THE STARLIGHT PLAY HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/play.css?v=prog1">
<body data-page="achievements">
<nav class="topnav">
  <div class="topnav-inner">
    <a class="topnav-brand" href="./">
      <img src="images/sora-starlight-logo.png" alt="Sora Starlight">
    </a>
    <div class="topnav-end">
      <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="topnav-panel">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
        <span class="visually-hidden">Open menu</span>
      </button>
      <div id="topnav-panel" class="topnav-panel">
        <div id="topnav-links" class="topnav-links"></div>
      </div>
      <div class="topnav-actions">
      <p id="auth-status" class="visually-hidden" role="status">Checking Twitch sign-in…</p>
      <button id="sign-in" class="signin-btn" type="button" hidden title="Sign in with Twitch">Sign in</button>
      <div id="account" class="account" hidden>
        <button id="account-button" class="account-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu">
          <img id="account-avatar" class="avatar" alt="" hidden>
          <span id="account-fallback" class="avatar-fallback" hidden></span>
          <span class="account-meta">
            <span id="account-name" class="account-name">Trainer</span>
            <span id="account-level" class="account-level" hidden></span>
          </span>
          <span class="account-caret" aria-hidden="true"></span>
        </button>
        <div id="account-menu" class="account-menu" hidden role="menu">
          <p id="account-handle" class="account-handle"></p>
          <div id="account-trainer" class="account-trainer" hidden></div>
          <a id="account-card" href="./trainer.html" role="menuitem">My Trainer ID</a>
          <a id="account-settings" href="./settings.html" role="menuitem">Settings</a>
          <a id="account-staff" href="./admin.html" hidden role="menuitem">Admin Hub</a>
          <button id="sign-out" type="button" role="menuitem">Sign out</button>
        </div>
      </div>
    </div>
    </div>
  </div>
</nav>
<div class="wrap">
  <div class="page-kicker">
    <h1>Achievements</h1>
  </div>
  <p id="gate" class="notice">Sign in with Twitch to open your trainer progress.</p>
  <div id="prog-app" hidden>
    <section class="card body" id="prog-header"></section>
    <section class="card body" style="margin-top:18px">
      <h2>Titles</h2>
      <p class="muted">Unlock many titles. Wear one at a time.</p>
      <div id="title-grid" class="prog-pick-grid"></div>
      <p id="title-status" class="muted" role="status"></p>
    </section>
    <section class="card body" style="margin-top:18px">
      <h2>Featured badges</h2>
      <p class="muted">Pick up to five badges to show on your Trainer ID.</p>
      <div id="badge-grid" class="prog-pick-grid"></div>
      <p id="badge-status" class="muted" role="status"></p>
    </section>
    <section class="card body" style="margin-top:18px">
      <div class="dex-toolbar">
        <h2>Achievements</h2>
        <label>Category
          <select id="ach-cat">
            <option value="all">All</option>
            <option value="pokedex">Pokédex</option>
            <option value="catching">Catching</option>
            <option value="shiny">Shiny Hunting</option>
            <option value="community">Community</option>
            <option value="items">Items</option>
            <option value="rare">Rare Encounters</option>
            <option value="trainer">Trainer</option>
            <option value="special">Special</option>
          </select>
        </label>
      </div>
      <div id="ach-grid" class="ach-grid"></div>
    </section>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/species.js"></script>
<script src="js/game.js?v=prog1"></script>
<script src="js/trainers.js?v=prog1"></script>
<script src="js/nav.js?v=evo1"></script>
<script src="js/achievements.js?v=prog1"></script>
</body>
