      <img src="images/sora-starlight-logo.png" alt="Sora Starlight">
    </a>
    <div class="topnav-end">
      <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="topnav-panel">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
        <span class="visually-hidden">Open menu</span>
      </button>
      <div id="topnav-panel" class="topnav-panel">
        <div id="topnav-links" class="topnav-links" aria-busy="true"></div>
      </div>
      <div class="topnav-actions">
      <p id="auth-status" class="visually-hidden" role="status">Checking sign-in…</p>
      <button id="sign-in" class="signin-btn" type="button" hidden>Sign in</button>
      <div id="account" class="account" data-auth="unknown">
        <button id="account-button" class="account-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu" aria-busy="true" disabled>
          <span class="twitch-face twitch-face-nav">
          <img id="account-avatar" class="avatar" alt="" width="34" height="34" hidden>
          <span id="account-fallback" class="avatar-fallback" aria-hidden="true">·</span>
          <i class="twitch-badge" title="Twitch linked" aria-hidden="true"></i>
        </span>
          <span class="account-meta">
            <span id="account-name" class="account-name">Trainer</span>

          <p id="account-handle" class="account-handle"></p>
          <div id="account-trainer" class="account-trainer" hidden></div>

        </div>
      </div>
    </div>
    </div>

<div class="wrap rank-page">
  <header class="rank-hero">
    <h1>Rankings</h1>
    <p>See how Trainers are progressing through their Pokémon adventures.</p>
  </header>

  <section id="rank-mine" class="rank-mine" hidden>
    <div class="rank-mine-head">
      <h2>Your Rankings</h2>
      <p class="muted">Your place on each lifetime board.</p>
    </div>
    <div id="rank-mine-grid" class="rank-mine-strip" role="list"></div>
  </section>

  <section class="rank-board-shell">
    <div class="rank-board-chrome">
      <div class="rank-boards" id="rank-boards" role="tablist" aria-label="Ranking boards">
        <button type="button" class="rank-board-tab" data-board="level" aria-pressed="true">Trainer Level</button>
        <button type="button" class="rank-board-tab" data-board="pokedex">Pokédex</button>
        <button type="button" class="rank-board-tab" data-board="shinies">Shinies</button>
        <button type="button" class="rank-board-tab" data-board="catches">Catches</button>
        <button type="button" class="rank-board-tab" data-board="evolutions">Evolutions</button>
        <button type="button" class="rank-board-tab" data-board="mastery">Mastery</button>
        <button type="button" class="rank-board-tab" data-board="honey">Honey</button>
        <button type="button" class="rank-board-tab" data-board="achievements">Achievements</button>
      </div>
      <div class="rank-board-meta">
        <h2 id="rank-board-title">Trainer Level</h2>
        <p id="rank-board-def" class="muted"></p>
        <p id="rank-status" class="rank-status muted">Loading rankings…</p>
      </div>
    </div>
    <div id="rank-fail" hidden></div>
    <div id="rank-you-pin" class="rank-you-pin" hidden></div>
    <div id="rank-list" class="rank-list" aria-busy="true" aria-live="polite"></div>
    <div class="rank-actions">
      <button type="button" id="rank-more" class="button" hidden>Load more</button>
      <button type="button" id="rank-refresh" class="button secondary">Refresh</button>
    </div>
  </section>

  <section class="rank-discover">
    <h2>Discover Trainers</h2>
    <p class="muted">Find public Trainer profiles by display name.</p>
    <form id="rank-search-form" class="rank-search">
      <label class="field" for="rank-search">Search by Trainer name
        <input id="rank-search" name="q" type="search" maxlength="40" placeholder="Trainer name" autocomplete="off" spellcheck="false">
      </label>
      <button type="submit" class="button">Search</button>
    </form>
    <p id="rank-search-status" class="muted" role="status"></p>
    <div id="rank-search-results" class="rank-discover-grid"></div>
    <div id="rank-spotlight" class="rank-spotlight" hidden></div>
    <div id="rank-recent"></div>
  </section>
</div>
