<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Encounter overlay</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #stage { height: 100%; display: none; place-items: center; }
  #stage.shown { display: grid; }
  #sprite { max-width: min(70vw, 520px); max-height: min(70vh, 520px); image-rendering: pixelated; }
</style>
<body>
  <main id="stage"><img id="sprite" alt="" onerror="window.playSpriteOnError && window.playSpriteOnError(this)"></main>
  <script src="js/config.js"></script>
  <script src="js/variants.js"></script>
  <script src="js/game.js?v=overlay1"></script>
  <script src="js/overlay.js?v=overlay1"></script>
</body>
</html>
