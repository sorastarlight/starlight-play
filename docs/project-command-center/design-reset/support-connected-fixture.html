<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support synthetic integration</title><link rel="stylesheet" href="../../../css/support.css"><body style="margin:30px;background:#f5effb"><h1>Local synthetic support integration</h1><p>No hosted calls, accounts or mail.</p><div id="fixture"></div><script>
if(!['127.0.0.1','localhost'].includes(location.hostname))throw Error('Local fixture only');
const fixtureTicket={id:'aaaaaaaa-0000-4000-8000-000000000001',playerId:'bbbbbbbb-0000-4000-8000-000000000001',caseNo:101,subject:'Synthetic support case',category:'bug',subcategory:'general',state:'open',priority:'normal',revision:1,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};let fixtureMessages=[{id:'m1',author:'Trainer',body:'This is a fictional support report used to verify the interface.',createdAt:new Date().toISOString()},{id:'m2',author:'Support',internal:true,body:'Internal synthetic note',createdAt:new Date().toISOString()}];
window.playSupabase={auth:{getUser:async()=>({data:{user:{id:'synthetic-owner'}}}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}})},rpc:async(name,{p_action:a,p_payload:p})=>{if(name!=='support_call')throw Error('Unexpected RPC');if(a==='list')return {data:{state:'ready',tickets:[fixtureTicket],openCount:1}};if(a==='get')return {data:{state:'ready',ticket:fixtureTicket,messages:fixtureMessages.filter(m=>p.mode==='staff'||!m.internal)}};if(a==='reply'){fixtureMessages.push({id:'m3',author:'Support',internal:p.internal,body:p.body,createdAt:new Date().toISOString()});fixtureTicket.revision++;return {data:{state:'saved',ticket:fixtureTicket}};}return {data:{state:'saved',ticket:fixtureTicket}};}};
</script><script src="../../../js/support.js"></script><script>PLAY_SUPPORT.mount(document.getElementById('fixture'),{staff:new URLSearchParams(location.search).get('staff')==='1'});</script></body></html>
