<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><base href="../"><title>Isolated signup feedback review</title><link rel="stylesheet" href="css/play.css">

<script>
window.PLAY_CONFIG={supabaseUrl:'https://auth-fixture.invalid',supabaseKey:'fictional-public-key'};
window.playBindAccountNav=()=>{};window.playSetAccountNav=()=>{};
window.playCall=async name=>{if(name==='play_username_available')return {available:true};throw Error('Unexpected fictional request');};
window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null}}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signUp:()=>new Promise((resolve,reject)=>{
 const button=document.getElementById('finish'),response=document.getElementById('response').value;button.disabled=false;button.onclick=()=>{button.disabled=true;button.onclick=null;if(response==='network')reject(Error('fictional offline'));else resolve({error:{code:response}});};
})}})};
</script><script src="js/auth.js"></script><script src="js/register.js"></script></html>
