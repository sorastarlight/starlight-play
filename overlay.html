<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Encounter overlay</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #stage { height: 100%; display: none; place-items: center; }
  #stage.shown { display: grid; }
  #support-alert {
    position: absolute; left: 24px; bottom: 24px; max-width: min(42vw, 360px);
    padding: 12px 16px; border-radius: 16px;
    background: linear-gradient(180deg, #fff7fc, #e8f4ff);
    color: #2a3048; font-family: Nunito, Segoe UI, sans-serif;
    box-shadow: 0 8px 24px rgba(40, 36, 56, .28);
    pointer-events: none;
  }
  #support-alert[hidden] { display: none; }
  .support-kicker { margin: 0; font-size: 12px; letter-spacing: .08em; color: #c45b93; font-weight: 800; }
  #support-who, #support-pack { margin: 2px 0 0; }
  #sprite { max-width: min(70vw, 520px); max-height: min(70vh, 520px); image-rendering: pixelated; }
  #stage.is-capture #sprite { animation: overlay-suck .55s ease forwards; }
  #stage.is-special {
    background:
      radial-gradient(circle at 50% 18%, rgba(255, 232, 168, .35), transparent 42%),
      radial-gradient(circle at 50% 80%, rgba(90, 70, 160, .28), transparent 50%);
  }
  #stage.is-special #sprite { filter: drop-shadow(0 0 18px rgba(255, 214, 120, .55)); }
  @keyframes overlay-suck {
    from { transform: scale(1); opacity: 1; }
    to { transform: scale(0); opacity: 0; }
  }
</style>
<body data-page="overlay">
  <aside id="support-alert" hidden>
    <p class="support-kicker">SUPPORT RECEIVED!</p>
    <p id="support-who"></p>
    <p id="support-pack"></p>
  </aside>
  <main id="stage"><img id="sprite" alt="" onerror="window.playSpriteOnError && window.playSpriteOnError(this)"></main>
  <script src="js/config.js?v=20260919-rc29"></script>
<script src="js/play-perf.js?v=20260919-rc29"></script>
<script src="js/build.js?v=20260919-rc29"></script>
<script src="js/build-client.js?v=20260919-rc29"></script>
  <script src="js/variants.js?v=20260919-rc29"></script>
<script src="js/forms.js?v=20260919-rc29"></script>
  <script src="js/game.js?v=20260919-rc29"></script>
<script src="js/play-present.js?v=20260919-rc29"></script>
<script src="js/play-encounter-state.js?v=20260919-rc29"></script>
  <script src="js/overlay.js?v=20260919-rc29"></script>
</body>
</html>
