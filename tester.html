<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Trainer login · THE STARLIGHT PLAY HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/play.css?v=20260914-rc9">
<body data-page="tester">
<nav class="topnav">
  <div class="topnav-inner">
    <a class="topnav-brand" href="./">
      <img src="images/sora-starlight-logo.png" alt="Sora Starlight">
    </a>
    <div class="topnav-end">
      <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="topnav-panel">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
        <span class="visually-hidden">Open menu</span>
      </button>
      <div id="topnav-panel" class="topnav-panel">
        <div id="topnav-links" class="topnav-links"></div>
      </div>
      <div class="topnav-actions">
      <p id="auth-status" class="visually-hidden" role="status">Checking sign-in…</p>
      <button id="sign-in" class="signin-btn" type="button" title="Sign in with Twitch">Sign in</button>
      <div id="account" class="account" hidden>
        <button id="account-button" class="account-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu">
          <span class="twitch-face twitch-face-nav">
          <img id="account-avatar" class="avatar" alt="" hidden>
          <span id="account-fallback" class="avatar-fallback" hidden></span>
          <i class="twitch-badge" title="Twitch linked" aria-hidden="true"></i>
        </span>
          <span class="account-meta">
            <span id="account-name" class="account-name">Trainer</span>
            <span id="account-level" class="account-level"></span>
          </span>
          <span class="account-caret" aria-hidden="true"></span>
        </button>
        <div id="account-menu" class="account-menu" hidden role="menu">
          <p id="account-handle" class="account-handle"></p>
          <div id="account-trainer" class="account-trainer" hidden></div>
          <a id="account-card" href="./trainer.html" role="menuitem">My Trainer ID</a>
          <a id="account-settings" href="./settings.html" role="menuitem">Settings</a>
          <a id="account-staff" href="./admin.html" hidden role="menuitem">Admin Hub</a>
          <button id="sign-out" type="button" role="menuitem">Sign out</button>
        </div>
      </div>
    </div>
    </div>
  </div>
</nav>
<div class="wrap">
  <div class="page-kicker">
    <h1>Trainer login</h1>
  </div>
  <section class="card body trainer-login-card">
    <p class="muted">Staff-created trainer accounts sign in here. There is no public sign-up. Viewers should keep using Sign in with Twitch on Play.</p>
    <form id="trainer-login-form">
      <label class="field" for="trainer-email">Email
        <input id="trainer-email" name="email" type="email" autocomplete="username" required>
      </label>
      <label class="field" for="trainer-password">Password
        <input id="trainer-password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <div class="links">
        <button type="submit">Sign in</button>
        <a class="button secondary" href="./">Back to Play</a>
      </div>
      <p id="trainer-login-status" class="muted" role="status"></p>
    </form>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=20260914-rc9"></script>
<script src="js/build.js?v=20260914-rc9"></script>
<script src="js/auth.js?v=20260914-rc9"></script>
<script src="js/game.js?v=20260914-rc9"></script>
<script src="js/nav.js?v=20260914-rc9"></script>
<script src="js/tester.js?v=20260914-rc9"></script>
</body>
