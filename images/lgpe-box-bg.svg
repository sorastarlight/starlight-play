<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
  <defs>
    <clipPath id="hero">
      <circle cx="0" cy="0" r="220"/>
    </clipPath>
  </defs>
  <rect width="1000" height="1000" fill="#ffe56a"/>
  <circle cx="130" cy="140" r="110" fill="#ffcf4a" opacity=".42"/>
  <circle cx="870" cy="150" r="120" fill="#8be08a" opacity=".26"/>
  <circle cx="120" cy="870" r="130" fill="#7ec8ff" opacity=".22"/>
  <circle cx="880" cy="850" r="140" fill="#ff8a8a" opacity=".2"/>

  <g transform="translate(500,500)">
    <g clip-path="url(#hero)">
      <rect x="-220" y="-220" width="440" height="220" fill="#ffb000"/>
      <rect x="-220" y="0" width="440" height="220" fill="#fffdf6"/>
      <rect x="-220" y="-24" width="440" height="48" fill="#b87a10"/>
    </g>
    <circle r="220" fill="none" stroke="#b87a10" stroke-width="22"/>
    <circle r="54" fill="#fffdf6" stroke="#b87a10" stroke-width="16"/>
    <circle r="22" fill="#ffe08a"/>
  </g>
</svg>
