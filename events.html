<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Upcoming Events · THE STARLIGHT PLAY HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/play.css">
<body data-page="events">
<nav class="topnav">
  <div class="topnav-inner">
    <a class="topnav-brand" href="./">
      <img src="images/sora-starlight-logo.png" alt="">
      <span>STARLIGHT PLAY</span>
    </a>
    <div id="topnav-links" class="topnav-links"></div>
    <div class="topnav-actions">
      <p id="auth-status" class="visually-hidden" role="status">Checking Twitch sign-in…</p>
      <button id="sign-in" class="signin-btn" type="button" hidden>Sign in with Twitch</button>
      <div id="account" class="account" hidden>
        <button id="account-button" class="account-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu">
          <img id="account-avatar" class="avatar" alt="" hidden>
          <span id="account-fallback" class="avatar-fallback" hidden></span>
          <span class="account-meta">
            <span id="account-name" class="account-name">Trainer</span>
            <span id="account-level" class="account-level" hidden></span>
          </span>
          <span class="account-caret" aria-hidden="true"></span>
        </button>
        <div id="account-menu" class="account-menu" hidden role="menu">
          <p id="account-handle" class="account-handle"></p>
          <div id="account-trainer" class="account-trainer" hidden></div>
          <a id="account-card" href="./trainer.html" role="menuitem">My Trainer ID</a>
          <a id="account-settings" href="./settings.html" role="menuitem">Settings</a>
          <a id="account-staff" href="./admin.html" hidden role="menuitem">Staff hub</a>
          <button id="sign-out" type="button" role="menuitem">Sign out</button>
        </div>
      </div>
    </div>
  </div>
</nav>
<div class="wrap">
  <div class="page-kicker">
    <h1>Upcoming Events</h1>
  </div>
  <div class="layout stack-2">
    <section class="card body">
      <div class="cal-nav">
        <button id="cal-prev" class="secondary" type="button">Previous</button>
        <h2 id="cal-title">Calendar</h2>
        <button id="cal-next" class="secondary" type="button">Next</button>
      </div>
      <div id="calendar" class="calendar"></div>
    </section>
    <section class="card body">
      <h2>Listed events</h2>
      <p id="event-status" class="muted">Loading events…</p>
      <div id="event-list" class="event-list"></div>
    </section>
  </div>
  <section id="event-staff" class="card body" hidden style="margin-top:18px">
    <h2>Add an event</h2>
    <p class="muted">Staff only. These show on the public calendar.</p>
    <label class="field" for="event-title">Title
      <input id="event-title" type="text" maxlength="80" placeholder="Shiny hunt night">
    </label>
    <label class="field" for="event-kind">Kind
      <select id="event-kind">
        <option value="community">Community encounter</option>
        <option value="shiny">Shiny hunt</option>
        <option value="raid">Raid / boss</option>
        <option value="stream">Stream special</option>
        <option value="other">Other</option>
      </select>
    </label>
    <label class="field" for="event-start">Starts
      <input id="event-start" type="datetime-local">
    </label>
    <label class="field" for="event-end">Ends (optional)
      <input id="event-end" type="datetime-local">
    </label>
    <label class="field" for="event-blurb">Blurb
      <input id="event-blurb" type="text" maxlength="200" placeholder="What trainers should expect">
    </label>
    <div class="links">
      <button id="event-save" type="button">Save event</button>
    </div>
    <p id="event-save-status" class="muted" role="status"></p>
  </section>
  <footer>Times follow your local clock.</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/game.js"></script>
<script src="js/nav.js"></script>
<script src="js/events.js"></script>
</body>
