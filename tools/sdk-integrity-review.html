<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><base href="../"><title>Isolated SDK integrity review</title><link rel="stylesheet" href="css/play.css"><main class="page" style="padding:24px;max-width:900px;margin:auto"><h1>SDK integrity loading review</h1><p>Loads the fixed public library in a sandbox only. No client initialization, account credentials, project configuration, Auth request or RPC.</p><button id="good">Load verified artifact</button><button id="bad">Test mismatched integrity</button><p id="result" role="status">Ready.</p><div id="frame"></div></main><script>
const pinned="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0",integrity="sha384-UagCvVPT5XXA0Hx+nJYUAGBFseHT9zBgpJMSebsAxl9lciTwbT+39j5VfRjdP5Tp";let active=null;const end='</scr'+'ipt>';function run(kind){document.getElementById('result').textContent='Loading isolated artifact…';active?.remove();const frame=document.createElement('iframe');frame.title='Sandboxed uninitialized SDK';frame.setAttribute('sandbox','allow-scripts');frame.style.cssText='width:100%;height:100px;border:1px solid #cbc6de';active=frame;document.getElementById('frame').append(frame);const token=kind+':'+Date.now();const expected=kind==='good'?integrity:'sha384-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';const handler=event=>{if(event.source!==frame.contentWindow||event.data?.token!==token)return;window.removeEventListener('message',handler);document.getElementById('result').textContent=kind==='good'?(event.data.loaded?'PASS: verified SDK loaded; createClient is available but was not called.':'FAIL: verified SDK did not load.'):(event.data.loaded?'FAIL: mismatched integrity was accepted.':'PASS: mismatched integrity blocked; SDK unavailable.');};window.addEventListener('message',handler);frame.srcdoc='<p>Public SDK load only; client never initialized.</p><script src="'+pinned+'" integrity="'+expected+'" crossorigin="anonymous">'+end+'<script>parent.postMessage({token:'+JSON.stringify(token)+',loaded:typeof window.supabase?.createClient==="function"},"*");'+end;}document.getElementById('good').onclick=()=>run('good');document.getElementById('bad').onclick=()=>run('bad');
</script></html>
