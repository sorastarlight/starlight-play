<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>My Pokédex · THE STARLIGHT PLAY HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/play.css?v=20261002-rc109">
<body data-page="pokedex">
<nav class="topnav">
  <div class="topnav-inner">
    <a class="topnav-brand" href="./">
      <img src="images/sora-starlight-logo.png" alt="Sora Starlight">
    </a>
    <div class="topnav-end">
      <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="topnav-panel">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
        <span class="visually-hidden">Open menu</span>
      </button>
      <div id="topnav-panel" class="topnav-panel">
        <div id="topnav-links" class="topnav-links" aria-busy="true"></div>
      </div>
      <div class="topnav-actions">
      <p id="auth-status" class="visually-hidden" role="status">Checking sign-in…</p>
      <button id="sign-in" class="signin-btn" type="button" hidden>Sign in</button>
      <div id="account" class="account" data-auth="unknown">
        <button id="account-button" class="account-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu" aria-busy="true" disabled>
          <span class="twitch-face twitch-face-nav">
          <img id="account-avatar" class="avatar" alt="" width="34" height="34" hidden>
          <span id="account-fallback" class="avatar-fallback" aria-hidden="true">·</span>
          <i class="twitch-badge" title="Twitch linked" aria-hidden="true"></i>
        </span>
          <span class="account-meta">
            <span id="account-name" class="account-name">Trainer</span>
            <span id="account-level" class="account-level">Lv. ·</span>
          </span>
          <span class="account-caret" aria-hidden="true"></span>
        </button>
        <div id="account-menu" class="account-menu" hidden role="menu">
          <p id="account-handle" class="account-handle"></p>
          <div id="account-trainer" class="account-trainer" hidden></div>
          <a id="account-card" href="./trainer.html" role="menuitem">My Trainer ID</a>
          <a id="account-settings" href="./settings.html" role="menuitem">Settings</a>
          <a id="account-staff" href="./admin.html" hidden role="menuitem">Admin Hub</a>
          <button id="sign-out" type="button" role="menuitem">Sign out</button>
        </div>
      </div>
    </div>
    </div>
  </div>
</nav>
<div class="wrap">
  <div class="page-kicker">
    <h1>My Pokédex</h1>
  </div>
  <p id="gate" class="notice">Sign in to open your Pokédex.</p>
  <div id="dex-app" hidden>
    <section class="dex-hero" aria-label="Pokédex">
      <div class="dex-hero-stage">
        <div class="dex-hero-glow" aria-hidden="true"></div>
        <div class="dex-hero-sparks" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="dex-hero-device-wrap">
          <span class="dex-hero-platform" aria-hidden="true"></span>
          <img class="dex-hero-device" src="images/pokedex/Kanto_PokeDex01.png" alt="Pokédex" width="520" height="360" decoding="async">
        </div>
        <div class="dex-hero-copy">
          <p class="dex-hero-kicker">Pokédex</p>
          <h2 class="dex-hero-title">Research Database</h2>
          <p class="dex-hero-sub visually-hidden">Pokédex research database</p>
          <div id="dex-hero-readouts" class="dex-hero-readouts" aria-live="polite"></div>
        </div>
      </div>
    </section>
    <section class="card body dex-toolbar">
      <div id="dex-counters" class="dex-counters" aria-live="polite"></div>
      <p id="dex-summary" class="muted visually-hidden"></p>
      <p id="dex-boundary-notice" class="notice" hidden role="status"></p>
      <div class="dex-filters">
        <label class="dex-search-label">Search Kanto Pokédex
          <input id="dex-search" class="dex-search" type="search" placeholder="Bulbasaur, 025, Mew…" autocomplete="off">
        </label>
        <label>Status
          <select id="filter-status">
            <option value="all">All</option>
            <option value="caught">Caught</option>
            <option value="seen">Seen only</option>
            <option value="unknown">Unknown</option>
          </select>
        </label>
      </div>
    </section>
    <div id="dex-grid" class="pokedex-grid"></div>
    <div id="dex-variants" hidden></div>
  </div>
</div>

<script src="js/forms.js?v=20261002-rc109"></script>
<script src="js/pokedex-reference.js?v=20261002-rc109"></script>
<script src="js/pokedex-presentation.js?v=20261002-rc109"></script>
<script src="js/pokedex-presentation-resolve.js?v=20261002-rc109"></script>
<script src="js/game.js?v=20261002-rc109"></script>
<script src="js/play-present.js?v=20261002-rc109"></script>
<script src="js/play-encounter-state.js?v=20261002-rc109"></script>
<script src="js/trainers.js?v=20261002-rc109"></script>
<script src="js/team.js?v=20261002-rc109"></script>
<script src="js/nav.js?v=20261002-rc109"></script>
<script src="js/special-events.js?v=20261002-rc109"></script>
<script src="js/pokedex.js?v=20261002-rc109"></script>
</body>
