<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Play · THE STARLIGHT PLAY HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/play.css?v=card3">
<body data-page="play">
<nav class="topnav">
  <div class="topnav-inner">
    <a class="topnav-brand" href="./">
      <img src="images/sora-starlight-logo.png" alt="Sora Starlight">
    </a>
    <div class="topnav-end">
      <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="topnav-panel">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
        <span class="visually-hidden">Open menu</span>
      </button>
      <div id="topnav-panel" class="topnav-panel">
        <div id="topnav-links" class="topnav-links"></div>
      </div>
      <div class="topnav-actions">
      <p id="auth-status" class="visually-hidden" role="status">Checking Twitch sign-in…</p>
      <button id="sign-in" class="signin-btn" type="button" hidden title="Sign in with Twitch">Sign in</button>
      <div id="account" class="account" hidden>
        <button id="account-button" class="account-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu">
          <img id="account-avatar" class="avatar" alt="" hidden>
          <span id="account-fallback" class="avatar-fallback" hidden></span>
          <span class="account-meta">
            <span id="account-name" class="account-name">Trainer</span>
            <span id="account-level" class="account-level" hidden></span>
          </span>
          <span class="account-caret" aria-hidden="true"></span>
        </button>
        <div id="account-menu" class="account-menu" hidden role="menu">
          <p id="account-handle" class="account-handle"></p>
          <div id="account-trainer" class="account-trainer" hidden></div>
          <a id="account-card" href="./trainer.html" role="menuitem">My Trainer ID</a>
          <a id="account-settings" href="./settings.html" role="menuitem">Settings</a>
          <a id="account-staff" href="./admin.html" hidden role="menuitem">Staff hub</a>
          <button id="sign-out" type="button" role="menuitem">Sign out</button>
        </div>
      </div>
    </div>
    </div>
  </div>
</nav>
<div class="wrap">
  <div class="page-kicker">
    <h1>Play</h1>
  </div>
  <div class="layout">
    <section class="card">
      <div class="hero">
        <div class="eyebrow">Live stream</div>
        <iframe id="stream-frame" title="Twitch stream" allowfullscreen></iframe>
        <p id="stream-note" class="muted">Loading the stream player…</p>
      </div>
    </section>
    <aside class="card dex-card">
      <div class="body">
        <div class="eyebrow">Wild encounter</div>
        <div id="encounter"></div>
        <p id="action-status" class="muted" role="status"></p>
        <div id="actions" class="action-grid"></div>
        <h3>My Inventory</h3>
        <div id="bag-status"></div>
      </div>
    </aside>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/game.js"></script>
<script src="js/hud.js"></script>
<script src="js/nav.js?v=nav1"></script>
<script src="js/play.js"></script>
</body>
