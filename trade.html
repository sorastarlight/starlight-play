<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Trade · THE STARLIGHT PLAY HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/play.css?v=hub1">
<body data-page="trade">
<nav class="topnav">
  <div class="topnav-inner">
    <a class="topnav-brand" href="./">
      <img src="images/sora-starlight-logo.png" alt="Sora Starlight">
    </a>
    <div class="topnav-end">
      <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="topnav-panel">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
        <span class="visually-hidden">Open menu</span>
      </button>
      <div id="topnav-panel" class="topnav-panel">
        <div id="topnav-links" class="topnav-links"></div>
      </div>
      <div class="topnav-actions">
      <p id="auth-status" class="visually-hidden" role="status">Checking Twitch sign-in…</p>
      <button id="sign-in" class="signin-btn" type="button" hidden title="Sign in with Twitch">Sign in</button>
      <div id="account" class="account" hidden>
        <button id="account-button" class="account-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu">
          <img id="account-avatar" class="avatar" alt="" hidden>
          <span id="account-fallback" class="avatar-fallback" hidden></span>
          <span class="account-meta">
            <span id="account-name" class="account-name">Trainer</span>
            <span id="account-level" class="account-level" hidden></span>
          </span>
          <span class="account-caret" aria-hidden="true"></span>
        </button>
        <div id="account-menu" class="account-menu" hidden role="menu">
          <p id="account-handle" class="account-handle"></p>
          <div id="account-trainer" class="account-trainer" hidden></div>
          <a id="account-card" href="./trainer.html" role="menuitem">My Trainer ID</a>
          <a id="account-settings" href="./settings.html" role="menuitem">Settings</a>
          <a id="account-staff" href="./admin.html" hidden role="menuitem">Admin Hub</a>
          <button id="sign-out" type="button" role="menuitem">Sign out</button>
        </div>
      </div>
    </div>
    </div>
  </div>
</nav>
<div class="wrap">
  <div class="page-kicker">
    <h1>Trade</h1>
  </div>
  <p id="gate" class="notice">Sign in with Twitch to browse and list Pokémon for trade.</p>
  <div id="trade-app" hidden>
    <section class="card body">
      <h2>Browse</h2>
      <p class="muted">Search by Pokémon, nickname, Trainer, or Let’s Go ID.</p>
      <div class="dex-filters">
        <label>Search
          <input id="trade-q" type="search" placeholder="Pikachu, trainer, LG00000001">
        </label>
        <label>I want
          <input id="trade-want" type="text" placeholder="Any species" autocomplete="off">
        </label>
        <label>Trainer
          <input id="trade-login" type="text" placeholder="Twitch login" autocomplete="off">
        </label>
      </div>
      <div class="links">
        <button id="trade-search" type="button">Search</button>
        <a class="button secondary" href="./storage.html">Open Storage</a>
      </div>
      <p id="trade-status" class="muted" role="status"></p>
      <div id="trade-board" class="caught-grid"></div>
    </section>
    <section id="list-panel" class="card body" style="margin-top:18px" hidden>
      <h2>List from Storage</h2>
      <p class="muted">Put one of your Pokémon up. You can ask for a species, or wait for any offer.</p>
      <div id="list-mon"></div>
      <label class="field" for="list-want">I want this Pokémon (optional)
        <input id="list-want" type="text" placeholder="ex: Pikachu">
      </label>
      <label class="field" for="list-note">Note
        <input id="list-note" type="text" maxlength="80" placeholder="Looking for a shiny, or open to offers">
      </label>
      <div class="links">
        <button id="list-submit" type="button">Put up for trade</button>
      </div>
    </section>
    <section id="listing-detail" class="card body" style="margin-top:18px" hidden></section>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/species.js"></script>
<script src="js/game.js?v=hub1"></script>
<script src="js/trainers.js?v=blank1"></script>
<script src="js/nav.js?v=hub1"></script>
<script src="js/trade.js?v=hub1"></script>
</body>
