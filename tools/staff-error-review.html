<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><base href="../"><title>Isolated staff error rendering review</title><link rel="stylesheet" href="css/play.css"><main class="page" style="max-width:960px;margin:auto;padding:24px"><h1>Staff error feedback review</h1><p>Actual rendering templates with fictional error text only. No staff page bootstrap,account connection or RPC.</p><button id="run">Render fictional errors</button><p id="result" role="status"></p><div id="samples"></div></main><script>
const files=['js/admin.js','js/admin-tools.js','js/admin-studio.js'];document.getElementById('run').onclick=async()=>{const host=document.getElementById('samples');host.replaceChildren();const nav=await(await fetch('js/nav.js')).text(),W={};new Function('window',nav.match(/window\.playEscapeAttr = function[\s\S]*?^};/m)[0])(W);const payload='Unexpected <em data-probe="literal">literal text</em> & "quotes"';W.playRpcError=()=>payload;W.playHumanRpcError=()=>payload;let count=0;for(const file of files){const source=await(await fetch(file)).text();for(const match of source.matchAll(/\.innerHTML\s*\+?=\s*(`[^`]*`)/g)){const template=match[1];if(!/playRpcError|playHumanRpcError|bridge\.lastError|\$\{(?:esc\()?message/.test(template))continue;const section=document.createElement('section');section.className='card';const label=document.createElement('h2');label.textContent=file+' · sample '+(++count);section.append(label);const sample=document.createElement('div');sample.innerHTML=new Function('window','esc','error','message','bridge','return '+template)(W,W.playEscapeAttr,{message:payload},payload,{lastError:payload});section.append(sample);host.append(section);}}document.getElementById('result').textContent=count+' actual templates rendered; '+host.querySelectorAll('[data-probe]').length+' injected markup nodes. Error text should remain literal.';};
</script></html>
